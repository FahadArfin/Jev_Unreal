name: Feature request
description: Propose a concrete workflow or editor operation.
title: "[Feature]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem
      description: What are you trying to build, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Give an example input and expected result, if possible.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Alternatives and constraints
      description: Consider editor versions, permissions, latency, and recovery.
