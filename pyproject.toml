[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-unreal"
version = "0.6.0a1"
description = "Typed Jev decisions and guarded MCP tools for Unreal Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jev_Unreal contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Games/Entertainment"]
dependencies = ["httpx>=0.28,<0.29", "mcp>=1.26,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "build>=1.3,<2"]

[project.scripts]
jev-unreal = "jev_unreal.cli:main"

[project.urls]
Repository = "https://github.com/FahadArfin/Jev_Unreal"
Issues = "https://github.com/FahadArfin/Jev_Unreal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_unreal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
